<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Javascript2</title>
    <style>
      body {
        background-color: antiquewhite;
      }
    </style>
  </head>
  <body>
    <h1>Del 1</h1>
    <script>
      function sjekkAlder1() {
        const inputFelt = document.querySelector("#alder1");
        const resultat = document.querySelector("#resultat1");
        const alder = inputFelt.value;
        if (alder >= 18) {
          resultat.innerHTML = "Du er myndig";
          console.log("Du er myndig!");
        } else {
          resultat.innerHTML = "Du er ikke myndig";
          console.log("Du er ikke myndig!");
        }
      }
    </script>
    <input type="number" id="alder1" />&nbsp;<button
      id="sjekk1"
      onclick="sjekkAlder1()"
    >
      Sjekk alder
    </button>
    <p id="resultat1"></p>
    <p>Se i console!</p>

    <h1>Del 2</h1>
    <script>
      function sjekkTemp2() {
        const inputFelt = document.querySelector("#temp2");
        const resultat = document.querySelector("#resultat2");
        const temp = inputFelt.value;
        if (temp >= 20) {
          resultat.innerHTML = "Det er varmt";
          console.log("Det er varmt!");
        } else {
          resultat.innerHTML = "Det er kaldt";
          console.log("Det er kaldt!");
        }
      }
    </script>
    <input type="number" id="temp2" />&nbsp;<button
      id="sjekk2"
      onclick="sjekkTemp2()"
    >
      Sjekk temperatur
    </button>
    <p id="resultat2"></p>
    <p>Se i console!</p>

    <h1>Del 3</h1>
    <script>
      function sjekkKarakter3() {
        const poeng = document.querySelector("#poeng3").value;
        if (poeng > 89) {
          console.log("Du fikk karakter A :)");
        } else if (poeng > 79) {
          console.log("Du fikk karakter B :|");
        } else if (poeng > 69) {
          console.log("Du fikk karakter C :(");
        } else {
          console.log("Du fikk karakter D :(");
        }
      }
    </script>
    <input type="number" id="poeng3" placeholder="Hvor mange poeng!" />&nbsp;
    <button onclick="sjekkKarakter3()">Sjekk</button>
    <p>Se i console!</p>

    <h1>Del 4</h1>
    <script>
      const alder4 = 17;
      const grense4 = 18;
      const poeng4 = "100";
      const maksPoeng4 = 100;

      console.log(alder4 == grense4);

      console.log(alder4 != grense4);

      console.log(alder4 > grense4);

      console.log(alder4 < grense4);

      console.log(alder4 >= grense4);

      console.log(alder4 <= grense4);

      console.log(poeng4 == maksPoeng4);

      console.log(poeng4 === maksPoeng4);
    </script>
    <p>Se i console!</p>

    <h1>Del 5</h1>
    <script>
      function sjekkBillett5() {
        const alder = document.querySelector("#alder5").value;
        const billett = document.querySelector("#billett5").checked;
        console.log(alder + " og " + billett);
        if (alder >= 16 && billett == true) {
          console.log("Du slipper inn!");
        } else {
          console.log("Du slipper ikke inn!");
        }
      }
    </script>
    <input type="number" placeholder="Hva er din alder" id="alder5" />
    <input type="checkbox" id="billett5" /> Har du billet (check)?<br />
    <button onclick="sjekkBillett5()">Sjekk</button>
    <p>Se i console!</p>

    <h1>Del 6</h1>
    <script>
      function sjekkTilgang6() {
        const elev = document.querySelector("#elev6").checked;
        const lærer = document.querySelector("#lærer6").checked;
        const resultat = document.querySelector("#resultat6");
        if (elev == true && lærer == true) {
          resultat.style.color = "red";
          resultat.innerHTML = "Du kan ikke komme inn!";
          console.log("Du kan ikke komme inn!");
        } else if (elev == true || lærer == true) {
          resultat.style.color = "green";
          resultat.innerHTML = "Du kan kom inn!";
          console.log("Du kan kom inn!");
        } else {
          resultat.style.color = "red";
          resultat.innerHTML = "Du kan ikke komme inn!";
          console.log("Du kan ikke komme inn!");
        }
      }
    </script>
    <input type="checkbox" id="elev6" />Jeg er elev<br />
    <input type="checkbox" id="lærer6" />Jeg er lærer<br />
    <button onclick="sjekkTilgang6()">Sjekk tilgang</button>
    <p id="resultat6"></p>
    <p>se i console og i side</p>

    <h1>Del 7</h1>
    Hvilken dag er det i dag?<br />
    <script>
      function sjekkDag7() {
        const dag = Number(document.querySelector("#uke7").value);
        const resultat = document.querySelector("#resultat7");

        switch (dag) {
          case 0:
            resultat.innerHTML = "Mandag";
            break;
          case 1:
            resultat.innerHTML = "Tirsdag";
            break;
          case 2:
            resultat.innerHTML = "Onsdag";
            break;
          case 3:
            resultat.innerHTML = "Torsdag";
            break;
          case 4:
            resultat.innerHTML = "Fredag";
            break;
          case 5:
            resultat.innerHTML = "Lørdag";
            break;
          case 6:
            resultat.innerHTML = "Søndag";
            break;
        }
      }
    </script>
    <select name="ukedag7" id="uke7" onchange="sjekkDag7()">
      <option value="0">Mandag</option>
      <option value="1">Tirsdag</option>
      <option value="2">onsdag</option>
      <option value="3">torsdag</option>
      <option value="4">fredag</option>
      <option value="5">lørdag</option>
      <option value="6">søndag</option>
    </select>
    <p id="resultat7"></p>
    <p>Se i siden</p>

        {
          name: "person 1",

        },
        {

          age: 12313,
        },
      ];
      
      for (let i = 1; i < myPeople.length; i++) {
        console.log(myPeople[i]);
      }
    </script>
    <p>Sjekk console</p>
  </body>
</html>
